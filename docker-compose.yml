services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: advance-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

# Redis is NOT here on purpose: this machine already runs redis-server as a
# system service on 6379, which the app connects to directly.
#   sudo systemctl status redis-server

volumes:
  qdrant_data:
